<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniPack Creator</title>
    <script src="jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #121212; color: #fff; }
        input, button { margin: 10px 0; padding: 10px; width: 100%; box-sizing: border-box; }
        button { background: #6200ea; color: white; border: none; font-weight: bold; }
    </style>
</head>
<body>
    <h3>Offline Audio DSP & Mapper</h3>
    <label>Load Track:</label> <input type="file" id="audioFile" accept="audio/*">
    <label>Slice Start (sec):</label> <input type="number" id="startTime" value="0" step="0.1">
    <label>Slice End (sec):</label> <input type="number" id="endTime" value="1" step="0.1">
    
    <label>Target Chain (1-8):</label> <input type="number" id="chain" value="1" min="1" max="8">
    <label>Pad X (1-8):</label> <input type="number" id="padX" value="1" min="1" max="8">
    <label>Pad Y (1-8):</label> <input type="number" id="padY" value="1" min="1" max="8">
    <label>MIDI Velocity Color (0-127):</label> <input type="number" id="colorVal" value="45" min="0" max="127">
    
    <button onclick="addSlice()">Add Pad to Memory</button>
    <button onclick="exportPack()">Export UniPack.zip</button>
    <div id="status"></div>

    <script>
        let sounds = []; 
        let audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let audioBuffer = null;

        document.getElementById('audioFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            audioBuffer = await audioContext.decodeAudioData(await file.arrayBuffer());
            document.getElementById('status').innerText = "Audio Decoded Successfully.";
        });

        async function addSlice() {
            if (!audioBuffer) return alert("Load audio first!");
            const start = parseFloat(document.getElementById('startTime').value);
            const end = parseFloat(document.getElementById('endTime').value);
            
            // Mathematical extraction based on Sample Rate
            const sampleRate = audioBuffer.sampleRate;
            const startIdx = Math.floor(start * sampleRate);
            const endIdx = Math.floor(end * sampleRate);
            const length = endIdx - startIdx;
            
            const sliceBuffer = audioContext.createBuffer(audioBuffer.numberOfChannels, length, sampleRate);
            for (let i = 0; i < audioBuffer.numberOfChannels; i++) {
                const channelData = audioBuffer.getChannelData(i);
                const sliceData = sliceBuffer.getChannelData(i);
                for (let j = 0; j < length; j++) { sliceData[j] = channelData[startIdx + j]; }
            }
            
            sounds.push({
                chain: document.getElementById('chain').value,
                x: document.getElementById('padX').value,
                y: document.getElementById('padY').value,
                color: document.getElementById('colorVal').value,
                wavBlob: encodeRIFF(sliceBuffer),
                filename: `${sounds.length.toString().padStart(3, '0')}.wav`
            });
            document.getElementById('status').innerText = `Grid Assigned: Pad ${sounds.length}`;
        }

        // Custom Binary Encoder for 16-bit PCM RIFF Header
        function encodeRIFF(buffer) {
            let numChannels = buffer.numberOfChannels;
            let result = numChannels === 2 ? interleave(buffer.getChannelData(0), buffer.getChannelData(1)) : buffer.getChannelData(0);
            let dataLength = result.length * 2;
            let bufferData = new ArrayBuffer(44 + dataLength);
            let view = new DataView(bufferData);

            let writeString = (view, offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true); // Linear Quantization
            view.setUint16(22, numChannels, true);
            view.setUint32(24, buffer.sampleRate, true);
            view.setUint32(28, buffer.sampleRate * numChannels * 2, true);
            view.setUint16(32, numChannels * 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataLength, true);

            let offset = 44;
            for (let i = 0; i < result.length; i++, offset += 2) {
                let s = Math.max(-1, Math.min(1, result[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return new Blob([view], { type: 'audio/wav' });
        }

        function interleave(left, right) {
            let res = new Float32Array(left.length + right.length);
            for (let i = 0; i < left.length; i++) { res[i*2] = left[i]; res[i*2+1] = right[i]; }
            return res;
        }

        async function exportPack() {
            if (sounds.length === 0) return alert("Assign pads first.");
            document.getElementById('status').innerText = "Compiling Archive...";
            const zip = new JSZip();
            let keySound = "";
            
            // Metadata Construction
            zip.file("info", `title=Termux Pack\nproducer=Mobile User\nchain=8`);
            zip.file("autoPlay", ""); 
            
            const soundsFolder = zip.folder("sounds");
            const keyLedFolder = zip.folder("keyLED");

            sounds.forEach(s => {
                soundsFolder.file(s.filename, s.wavBlob);
                keySound += `${s.chain} ${s.x} ${s.y} ${s.filename}\n`;
                // Serialization of Novation Animation Data via MIDI Velocity
                keyLedFolder.file(`${s.chain} ${s.x} ${s.y} 1`, `d 0\no 144 0 ${s.color}\n`); 
            });

            zip.file("keySound", keySound);

            const content = await zip.generateAsync({ type: "base64" });
            if (window.AndroidBridge) {
                window.AndroidBridge.saveZip("data:application/zip;base64," + content, "MyTermuxPack.zip");
            }
            document.getElementById('status').innerText = "Exporting to device downloads.";
        }
    </script>
</body>
</html>
