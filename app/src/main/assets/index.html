<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniPack Creator</title>
    <script src="jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #121212; color: #fff; margin: 0; }
        .controls { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        input, button, select { margin: 5px 0; padding: 10px; width: 100%; box-sizing: border-box; background: #333; color: white; border: 1px solid #555; }
        button { background: #6200ea; font-weight: bold; border: none; margin-top: 10px; }
        .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; aspect-ratio: 1; max-width: 400px; margin: 0 auto; }
        .pad { background: #333; border-radius: 4px; aspect-ratio: 1; border: none; cursor: pointer; }
        .pad.assigned { background: #03dac6; }
    </style>
</head>
<body>
    <div class="controls">
        <h3>1. Audio Setup</h3>
        <input type="file" id="audioFile" accept="audio/*">
        <div style="display: flex; gap: 10px;">
            <div><label>Start (s):</label><input type="number" id="startTime" value="0" step="0.1"></div>
            <div><label>End (s):</label><input type="number" id="endTime" value="1" step="0.1"></div>
        </div>
        <label>Color (Velocity 0-127):</label> <input type="number" id="colorVal" value="45" min="0" max="127">
    </div>

    <div class="controls">
        <h3>2. Grid Mapper (Tap to Assign)</h3>
        <label>Current Chain:</label>
        <select id="chain">
            <option value="1">Chain 1</option>
            <option value="2">Chain 2</option>
            <option value="3">Chain 3</option>
        </select>
        <div class="grid" id="launchpad"></div>
    </div>

    <button onclick="exportPack()">3. Export UniPack.zip</button>
    <div id="status" style="margin-top: 15px; text-align: center; color: #03dac6;"></div>

    <script>
        let sounds = []; 
        let audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let audioBuffer = null;

        // Build 8x8 Visual Grid
        const grid = document.getElementById('launchpad');
        for(let y = 1; y <= 8; y++) {
            for(let x = 1; x <= 8; x++) {
                let btn = document.createElement('button');
                btn.className = 'pad';
                btn.dataset.x = x;
                btn.dataset.y = y;
                btn.onclick = () => assignToPad(btn, x, y);
                grid.appendChild(btn);
            }
        }

        document.getElementById('audioFile').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            audioBuffer = await audioContext.decodeAudioData(await file.arrayBuffer());
            document.getElementById('status').innerText = "Track Loaded. Adjust times and tap a pad.";
        });

        async function assignToPad(padElement, x, y) {
            if (!audioBuffer) return alert("Load audio first!");
            const start = parseFloat(document.getElementById('startTime').value);
            const end = parseFloat(document.getElementById('endTime').value);
            const chain = document.getElementById('chain').value;
            const color = document.getElementById('colorVal').value;
            
            const sampleRate = audioBuffer.sampleRate;
            const startIdx = Math.floor(start * sampleRate);
            const endIdx = Math.floor(end * sampleRate);
            const length = endIdx - startIdx;
            
            const sliceBuffer = audioContext.createBuffer(audioBuffer.numberOfChannels, length, sampleRate);
            for (let i = 0; i < audioBuffer.numberOfChannels; i++) {
                const channelData = audioBuffer.getChannelData(i);
                const sliceData = sliceBuffer.getChannelData(i);
                for (let j = 0; j < length; j++) sliceData[j] = channelData[startIdx + j];
            }
            
            sounds.push({ chain, x, y, color, wavBlob: encodeRIFF(sliceBuffer), filename: `${sounds.length.toString().padStart(3, '0')}.wav` });
            padElement.classList.add('assigned');
            document.getElementById('status').innerText = `Assigned slice to Chain ${chain}, Pad [${x},${y}]`;
        }

        function encodeRIFF(buffer) {
            let numChannels = buffer.numberOfChannels;
            let result = numChannels === 2 ? interleave(buffer.getChannelData(0), buffer.getChannelData(1)) : buffer.getChannelData(0);
            let dataLength = result.length * 2;
            let bufferData = new ArrayBuffer(44 + dataLength);
            let view = new DataView(bufferData);

            let writeString = (v, o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
            writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + dataLength, true); writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, numChannels, true);
            view.setUint32(24, buffer.sampleRate, true); view.setUint32(28, buffer.sampleRate * numChannels * 2, true);
            view.setUint16(32, numChannels * 2, true); view.setUint16(34, 16, true); writeString(view, 36, 'data'); view.setUint32(40, dataLength, true);

            let offset = 44;
            for (let i = 0; i < result.length; i++, offset += 2) {
                let s = Math.max(-1, Math.min(1, result[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return new Blob([view], { type: 'audio/wav' });
        }

        function interleave(left, right) {
            let res = new Float32Array(left.length + right.length);
            for (let i = 0; i < left.length; i++) { res[i*2] = left[i]; res[i*2+1] = right[i]; }
            return res;
        }

        async function exportPack() {
            if (sounds.length === 0) return alert("Assign pads first.");
            document.getElementById('status').innerText = "Compiling Archive...";
            const zip = new JSZip();
            let keySound = "";
            
            zip.file("info", `title=Unimaker Pack\nproducer=Gajanan Patagar\nchain=8`);
            zip.file("autoPlay", ""); 
            const soundsFolder = zip.folder("sounds"); const keyLedFolder = zip.folder("keyLED");

            sounds.forEach(s => {
                soundsFolder.file(s.filename, s.wavBlob);
                keySound += `${s.chain} ${s.x} ${s.y} ${s.filename}\n`;
                keyLedFolder.file(`${s.chain} ${s.x} ${s.y} 1`, `d 0\no 144 0 ${s.color}\n`); 
            });

            zip.file("keySound", keySound);
            const content = await zip.generateAsync({ type: "base64" });
            if (window.AndroidBridge) window.AndroidBridge.saveZip("data:application/zip;base64," + content, "Unimaker_Pack.zip");
            document.getElementById('status').innerText = "Saved to Downloads!";
        }
    </script>
</body>
</html>
